name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    name: Worker and web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Install Worker dependencies
        run: pnpm install --frozen-lockfile
      - name: Install node UI dependencies
        run: pnpm --dir node install --frozen-lockfile
      - name: Audit JavaScript production dependencies
        run: |
          pnpm audit --prod --audit-level=moderate
          pnpm --dir node audit --prod --audit-level=moderate
      - name: Run canonical fast checks
        run: pnpm verify:fast
      - name: Enforce Worker coverage thresholds
        run: pnpm test:coverage
      - name: Upload coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: worker-coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: error
      - name: Build fleet console
        run: pnpm build:web
      - name: Build node UI
        run: pnpm --dir node build

  node-rust:
    name: Node Rust (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgl1 \
            libglx0 \
            libharfbuzz0b \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget \
            xdg-utils
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Install pinned Rust dependency auditor
        if: runner.os == 'Linux'
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Rust dependencies
        if: runner.os == 'Linux'
        run: cargo audit --file node/src-tauri/Cargo.lock
      - name: Check Rust formatting
        run: cargo fmt --manifest-path node/src-tauri/Cargo.toml -- --check
      - name: Run Clippy with warnings denied
        run: cargo clippy --manifest-path node/src-tauri/Cargo.toml --all-targets --locked -- -D warnings -D clippy::cognitive_complexity
      - name: Run Rust tests
        run: cargo test --manifest-path node/src-tauri/Cargo.toml --locked
      - name: Typecheck Swift client
        if: runner.os == 'macOS'
        run: xcrun swiftc -typecheck clients/swift/MereRunRelayClient.swift
      - name: Set up Node.js for Linux package build
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: runner.os == 'Linux'
        with:
          node-version: 24
      - name: Set up pinned pnpm for Linux package build
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        if: runner.os == 'Linux'
      - name: Build Linux x86_64 packages
        if: runner.os == 'Linux'
        run: |
          pnpm --dir node install --frozen-lockfile
          pnpm --dir node tauri build --bundles appimage
          appimage="$(find node/src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f -print -quit)"
          ./scripts/verify-node-appimage.sh "$appimage"
          pnpm --dir node tauri build --bundles deb
          deb="$(find node/src-tauri/target/release/bundle/deb -name '*.deb' -type f -print -quit)"
          ./scripts/verify-node-deb.sh "$deb" x86_64
      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: runner.os == 'Linux'
        with:
          name: mere-run-node-linux-x86_64
          path: node/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Upload Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: runner.os == 'Linux'
        with:
          name: mere-run-node-linux-x86_64-deb
          path: node/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
