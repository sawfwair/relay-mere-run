[package]
name = "mere-run-node"
version = "0.2.15"
description = "mere.run node — a generation node for the mere.run relay"
authors = ["mere.run"]
license = "MIT"
repository = "https://github.com/sawfwair/relay-mere-run"
homepage = "https://mere.run"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "node_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "fs", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
anyhow = "1"
base64 = "0.22"
hostname = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

[dev-dependencies]
# Enables tauri::test::mock_app so the ignored live e2e test can drive the
# real agent loop without a window.
tauri = { version = "2", features = ["test"] }
