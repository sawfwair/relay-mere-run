[package]
name = "mere-run-node-headless"
version = "0.2.23"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "mere-run-node-headless"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "fs", "net", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
anyhow = "1"
base64 = "0.22"
hostname = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

